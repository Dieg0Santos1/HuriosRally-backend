spring.application.name=huriosbackend
server.port=8080

# Base segura para arrancar sin requerir MySQL o SMTP al inicio.
spring.autoconfigure.exclude=\
org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

# Configuracion futura sugerida
# spring.datasource.url=jdbc:mysql://localhost:3306/huriosdb
# spring.datasource.username=root
# spring.datasource.password=
jwt.secret=dev-secret-key-for-hurios-rally-2026-jwt-token
jwt.expiration.minutes=120
# app.frontend.url=http://localhost:5173

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
app.email.mock=true
backup.base-path=uploads/backups
