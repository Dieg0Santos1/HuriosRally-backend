spring.application.name=huriosbackend
server.port=8080

# Base local para desarrollo sin depender de MySQL.
spring.datasource.url=jdbc:h2:file:./data/huriosdb;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

jwt.secret=dev-secret-key-for-hurios-rally-2026-jwt-token
jwt.expiration.minutes=120
app.frontend.url=http://localhost:5173

spring.mail.host=localhost
spring.mail.port=1025

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
app.email.mock=true
backup.base-path=uploads/backups
